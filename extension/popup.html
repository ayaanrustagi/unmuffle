<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unmuffle</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main class="panel">
    <div class="head">
      <div class="titles">
        <div class="title">Unmuffle</div>
        <div class="status" id="status">Off</div>
      </div>
      <label class="toggle" title="Turn Unmuffle on for this tab"><input type="checkbox" id="power" role="switch" aria-label="Unmuffle"><span></span></label>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="display"><canvas id="analyzer"></canvas></div>
    <div class="readout">
      <span><i class="lg-original"></i>Original</span>
      <span id="legend-clean"><i class="lg-clean"></i>Cleaned</span>
      <output id="cleanup">Off</output>
    </div>

    <div class="row">
      <span>Preset</span>
      <select id="preset" aria-label="Preset"></select>
    </div>
    <p class="summary" id="summary"></p>
    <div class="row">
      <span>Listen to</span>
      <div class="segmented" role="radiogroup" aria-label="Listen to">
        <button data-enhanced="false" role="radio" aria-checked="false">Original</button>
        <button data-enhanced="true" role="radio" aria-checked="true">Enhanced</button>
      </div>
    </div>

    <details id="adjust">
      <summary>Adjust</summary>
      <div class="sliders" id="sliders"></div>
    </details>

    <div class="foot">
      <span>Runs on your device. Nothing is recorded.</span>
      <a href="https://github.com/ayaanrustagi/unmuffle" target="_blank">GitHub</a>
    </div>
  </main>
</body>
</html>
