name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Test engine
        run: swift test
      - name: Check the extension engine matches the Swift one
        run: |
          swift build --product unmuffle-cli
          UNMUFFLE_CLI="$(swift build --show-bin-path)/unmuffle-cli" node --test "extension/test/*.test.js"
      - uses: actions/upload-artifact@v4
        with:
          name: Unmuffle.app
          path: build/Unmuffle.app

  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test engine
        run: swift test

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test extension engine
        run: node --test "extension/test/*.test.js"

  screenshots:
    # Renders the real menu bar window on a Mac and publishes the PNGs to the
    # `screenshots` branch, so the README always shows the app as it is.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Render the window
        timeout-minutes: 3
        run: build/Unmuffle.app/Contents/MacOS/Unmuffle --snapshot "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Publish to the screenshots branch
        run: |
          cd "$RUNNER_TEMP/screenshots"
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
