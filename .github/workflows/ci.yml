name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Test
        run: swift test
      - uses: actions/upload-artifact@v4
        with:
          name: Unmuffle.app
          path: build/Unmuffle.app

  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test DSP
        run: swift test
